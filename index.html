.brand h1{margin:0;font-family:Georgia,serif;letter-spacing:.04em;font-size:clamp(16px,5.4vw,26px);font-weight:900;color:#fff;white-space:nowrap;line-height:1.15}.brand>div:last-child{min-width:0}

h2{margin:6px 0 14px;font-size:22px;font-weight:900;color:var(--ac)}
.card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--bg);border:2px solid var(--ac);border-radius:22px;padding:14px;margin-bottom:12px;color:var(--tx);font:inherit;font-weight:700;cursor:pointer;box-shadow:0 3px 0 var(--ac)}
.card:hover,.card:active{background:var(--sf);transform:translateY(1px);box-shadow:0 2px 0 var(--ac)}
.ico{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:26px;flex:none;background:var(--ac);box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
label{display:block;font-size:14px;font-weight:700;color:var(--ac);margin:12px 0 4px}

.st{background:var(--ac);color:#fff;border-radius:20px;padding:16px;font-weight:700}

.s-new{background:var(--wn)}.s-progress{background:var(--ac)}.s-done{background:var(--ok)}

.back{background:none;border:0;color:var(--ac);font:inherit;font-weight:800;padding:0 0 8px;cursor:pointer}
.ok{background:var(--sf);border:3px solid var(--ac);border-radius:18px;padding:18px;text-align:center}

nav button span{display:block;font-size:22px}
nav button.on{background:#fff;color:var(--hd);font-weight:900}
dialog{border:0;border-radius:20px;max-width:420px;background:var(--bg);color:var(--tx);padding:20px;border-top:6px solid var(--ac)}
dialog::backdrop{background:rgba(7,18,46,.6)}
.err{color:var(--er);font-size:14px;font-weight:700;margin-top:8px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.bar .m{color:var(--mu);font-size:13px}

function toEth(d){

  const k=jdn-1724221,r=k%1461,n=(r%365)+365*Math.floor(r/1460);
  return{y:4*Math.floor(k/1461)+Math.floor(r/365)-Math.floor(r/1460),m:Math.floor(n/30)+1,d:(n%30)+1};
}

const t=k=>T[lang][k];
const oName=id=>{const o=O.find(x=>x[0]===id);return o?o[LI[lang]]:id};
const SLOTS=["08:30","09:00","09:30","10:00","10:30","11:00","14:30","15:00","15:30","16:00","16:30"];

/* ---------- accounts (Firebase Auth + Firestore profile) ---------- */
async function loadProfile(uid){
  const d=await db.collection("staff").doc(uid).get();
  return d.exists?{id:uid,...d.data()}:null;
}
function stopListen(){if(unsub){try{unsub()}catch(e){}unsub=null}rows=[]}
if(auth){
  auth.onAuthStateChanged(async u=>{
    if(creating)return;
    try{
      if(u){
        meAcc=await loadProfile(u.uid);
        if(!meAcc){await auth.signOut();aerr=t("errLogin")}
      }else{meAcc=null}
    }catch(e){meAcc=null;aerr=authErr(e);try{await auth.signOut()}catch(x){}}
    if(!meAcc){stopListen();accs=[];accLoaded=false}
    ready=true;busy=false;render();
  });
}else{ready=true;render()}
// Never leave the staff page stuck on "…" (e.g. when opened from a file or without network)
setTimeout(()=>{if(!ready){ready=true;render()}},2500);

const authErr=e=>{
  const c=(e&&e.code)||"";
  if(["auth/invalid-credential","auth/user-not-found","auth/wrong-password","auth/invalid-email"].includes(c))return t("errLogin");
  if(c==="auth/email-already-in-use")return t("errExists");
  if(c==="app/bad-code")return t("errCode");
  if(c==="app/bad-office")return t("errOffice");
  if(c==="app/admin-exists")return t("errSetup");
  if(c==="auth/weak-password")return t("errShort");
  const why={
    "auth/operation-not-allowed":"Firebase Console → Authentication → Sign-in method → enable Email/Password.",
    "auth/unauthorized-domain":"Firebase Console → Authentication → Settings → Authorized domains → add this site's domain.",
    "auth/network-request-failed":"No internet connection.",
    "auth/operation-not-supported-in-this-environment":"Open this page from an https:// address (not a local file).",
    "auth/invalid-api-key":"Invalid API key.",
    "auth/api-key-not-valid":"Invalid API key.",
    "auth/too-many-requests":"Too many attempts, try again later.",
    "permission-denied":"Firestore rules block this: publish firestore.rules in Firebase Console → Firestore → Rules.",
    "unavailable":"Firestore not reachable: create the Firestore Database in Firebase Console.",
    "not-found":"Create the Firestore Database in Firebase Console."
  }[c]||"";
  return t("errNet")+" ["+esc(c||(e&&e.message)||"?")+"] "+esc(why);
};
async function doAuth(){
  if(busy||!auth)return;
  const g=id=>($("#"+id)?.value||"").trim();
  const u=g("a_u").toLowerCase(),pw=$("#a_p")?.value||"";
  aerr="";
  if(authTab==="create"){
    const n=g("a_n"),pw2=$("#a_p2")?.value||"",code=g("a_c").toUpperCase().replace(/[^A-Z0-9]/g,""),off=g("a_o");
    if(!n||!u||!pw||!code)aerr=t("req");
    else if(u==="admin")aerr=t("errExists");
    else if(!/^[a-z0-9_.-]{3,24}$/.test(u))aerr=t("errUser");
    else if(pw.length<6)aerr=t("errShort");
    else if(pw!==pw2)aerr=t("errMatch");
    if(aerr){render();return}
    busy=true;creating=true;render();
    let fresh=false;
    try{
      let cred;
      try{cred=await auth.createUserWithEmailAndPassword(u+EMAIL_DOMAIN,pw);fresh=true}
      catch(e){
        if(e.code!=="auth/email-already-in-use")throw e;
        // username used before: only reusable if its staff profile was deleted and the password matches
        try{cred=await auth.signInWithEmailAndPassword(u+EMAIL_DOMAIN,pw)}catch(x){throw{code:"auth/email-already-in-use"}}
        if(await loadProfile(cred.user.uid))throw{code:"auth/email-already-in-use"};
      }
      const uid=cred.user.uid,now=Date.now();
      const base={name:n.slice(0,80),username:u,created:now};
      let prof=null;
      if(code){
        // Staff account: needs a valid, unused invitation code from the administrator.
        const inv=await db.collection("invites").doc(code).get();
        if(!inv.exists||inv.data().used)throw{code:"app/bad-code"};
        if(inv.data().office!==off)throw{code:"app/bad-office"};
        const a={...base,office:inv.data().office,role:"staff",status:"ok",code};
        const b=db.batch();
        b.set(db.collection("staff").doc(uid),a);
        b.update(db.collection("invites").doc(code),{used:true,usedBy:uid});
        try{await b.commit()}catch(e){throw{code:"app/bad-code"}}
        prof={id:uid,...a};
      }else try{
        // First account ever: atomically claim the bootstrap marker and become admin.
        const b=db.batch();
        b.set(db.collection("meta").doc("bootstrap"),{uid});
        const a={...base,office:"admin",role:"admin",status:"ok"};
        b.set(db.collection("staff").doc(uid),a);
        await b.commit();
        prof={id:uid,...a};
      }catch(e){
        throw{code:"app/bad-code"};
      }
      meAcc=prof;
    }catch(e){
      aerr=authErr(e);
      try{if(fresh&&auth.currentUser)await auth.currentUser.delete();else await auth.signOut()}catch(x){}
    }
    creating=false;busy=false;accLoaded=false;render();
  }else{
    if(!u||!pw){aerr=t("req");render();return}
    busy=true;render();
    try{await auth.signInWithEmailAndPassword(u+EMAIL_DOMAIN,pw)}
    catch(e){aerr=authErr(e);busy=false;render()}
    // onAuthStateChanged finishes the sign-in and re-renders
  }
}
async function doAdminAuth(){
  if(busy||!auth)return;
  const g=id=>($("#"+id)?.value||"").trim();
  const u="admin",pw=$("#ad_p")?.value||"";
  aerr="";
  if(adminSetup){
    const n="Administrator",pw2=$("#ad_p2")?.value||"";
    if(!n||!u||!pw)aerr=t("req");
    else if(!/^[a-z0-9_.-]{3,24}$/.test(u))aerr=t("errUser");
    else if(pw.length<6)aerr=t("errShort");
    else if(pw!==pw2)aerr=t("errMatch");
    if(aerr){render();return}
    busy=true;creating=true;render();
    let fresh=false;
    try{
      const cred=await auth.createUserWithEmailAndPassword(u+EMAIL_DOMAIN,pw);fresh=true;
      const uid=cred.user.uid,a={name:n.slice(0,80),username:u,created:Date.now(),office:"admin",role:"admin",status:"ok"};
      const b=db.batch();
      b.set(db.collection("meta").doc("bootstrap"),{uid});
      b.set(db.collection("staff").doc(uid),a);
      try{await b.commit()}catch(e){throw{code:"app/admin-exists"}}
      meAcc={id:uid,...a};adminSetup=false;
    }catch(e){aerr=authErr(e);try{if(fresh&&auth.currentUser)await auth.currentUser.delete()}catch(x){}}
    creating=false;busy=false;accLoaded=false;render();
  }else{
    if(!u||!pw){aerr=t("req");render();return}
    busy=true;render();
    try{await auth.signInWithEmailAndPassword(u+EMAIL_DOMAIN,pw)}
    catch(e){aerr=authErr(e);busy=false;render()}
  }
}
async function changePw(){
  perr="";pmsg="";
  const o=$("#cp_o").value,n=$("#cp_n").value;
  if(!o||!n)perr=t("req");
  else if(n.length<6)perr=t("errShort");
  else try{
    const u=auth.currentUser;
    await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,o));
    await u.updatePassword(n);pmsg=t("pwChanged");
  }catch(e){perr=authErr(e)}
  render();
}
async function signOut(){
  stopListen();meAcc=null;accs=[];accLoaded=false;staffOff="all";aerr="";
  try{if(auth)await auth.signOut()}catch(e){}
  render();
}
async function refreshAcc(){
  accLoaded=true;
  try{const q=await db.collection("staff").get();accs=q.docs.map(d=>({id:d.id,...d.data()}))}catch(e){}
  try{const q=await db.collection("invites").get();invs=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.created-a.created)}catch(e){}
  render();
}
async function recheck(){
  aerr="";
  try{if(auth.currentUser)meAcc=await loadProfile(auth.currentUser.uid)}catch(e){aerr=t("errNet")}
  if(!meAcc){await signOut();aerr=t("errLogin")}
  render();
}

function listen(){
  if(unsub||!db||!isStaffOk())return;
  try{
    // Non-admins may only query their own office (matches the security rules).
    let q=db.collection("reqs");
    if(!isAdmin())q=q.where("office","==",meAcc.office);
    unsub=q.onSnapshot(s=>{rows=s.docs.map(d=>({id:d.id,...d.data()}));if(view==="staff"||view==="admin")render()},()=>{})
  }catch(e){}
}

/* ---------- render ---------- */
function render(){
  document.documentElement.lang=lang;
  $("#tag").textContent=t("tag");
  document.querySelectorAll("#lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
  $("#n1").innerHTML=`<span>📅</span>${t("book")}`;$("#n2").innerHTML=`<span>🔐</span>${t("staffNav")}`;
  $("#n3").innerHTML=`<span>🛡️</span>${t("adminNav")}`;
  $("#n1").className=(view==="staff"||view==="admin")?"":"on";$("#n2").className=view==="staff"?"on":"";$("#n3").className=view==="admin"?"on":"";
  $("#app").innerHTML=view==="staff"?staffView():view==="admin"?adminView():view==="form"?formView():homeView();
  bind();
}
function homeView(){
  const mine=store.get("mine",[]);
  return`<h2>${t("q")}</h2>`+O.map(o=>`<button class="card" data-o="${o[0]}"><span class="ico">${o[1]}</span><span>${esc(o[LI[lang]])}</span></button>`).join("")+
  (mine.length?`<h2 style="font-size:18px;margin-top:22px">${t("mine")}</h2>`+mine.slice().reverse().map(r=>`<div class="item"><b>${r.id}</b> · ${esc(oName(r.office))}<div class="m">${r.type==="ap"?t("ap")+" · "+fmt(r.date)+" "+r.time:t("co")}</div></div>`).join(""):"")+
  `<p class="note">${t("foot")}</p>`;
}
function formView(){
  if(sent)return`<div class="ok"><div style="font-size:40px">✅</div><div>${t("done")}</div><code>${sent}</code><div class="m">${t("keep")}</div>${db&&!sentOffline?"":`<div class="m">${t("offline")}</div>`}<button class="btn" id="home">${t("offices")}</button></div>`;
  const ds=days(1,21);
  return`<button class="back" id="bk">${t("back")}</button><h2>${esc(oName(office))}</h2>
  <label>${t("kind")}</label><div class="seg"><button data-k="ap" class="${kind==="ap"?"on":""}">${t("ap")}</button><button data-k="co" class="${kind==="co"?"on":""}">${t("co")}</button></div>
  <label>${t("name")}</label><input id="f_n" autocomplete="name" maxlength="100">
  <label>${t("phone")}</label><input id="f_p" type="tel" inputmode="tel" autocomplete="tel" maxlength="30">
  ${kind==="ap"?`<label>${t("date")}</label><select id="f_d">${ds.map(d=>`<option value="${d}">${fmt(d)}</option>`).join("")}</select>
  <label>${t("time")}</label><select id="f_t">${SLOTS.map(s=>`<option>${s}</option>`).join("")}</select>`:""}
  <label>${t("purpose")}</label><textarea id="f_x" maxlength="1500"></textarea>
  <div class="err">${err}</div><button class="btn" id="go">${t("send")}</button>`;
}
function staffView(){
  if(!ready)return`<p class="note">…</p>`;
  if(!meAcc)return authView();
  if(!isStaffOk())return pendingView();
  listen();
  if(!isAdmin())staffOff=meAcc.office;
  const ds=days(-7,21),today=iso(new Date());
  if(!staffDate)staffDate=ds.includes(today)?today:ds[ds.length>7?7:0];
  const inOff=r=>staffOff==="all"||r.office===staffOff;
  const aps=rows.filter(r=>r.type==="ap"&&r.date===staffDate&&inOff(r)).sort((a,b)=>a.time>b.time?1:-1);
  const cos=rows.filter(r=>r.type==="co"&&inOff(r)).sort((a,b)=>b.created-a.created);
  const open=cos.filter(r=>r.status!=="done").length;
  const item=r=>`<div class="item"><b>${esc(r.name)}</b> · <a href="tel:${esc(r.phone)}" style="color:var(--ac);font-weight:700">${esc(r.phone)}</a> <span class="pill s-${esc(r.status)}">${t("st")[r.status]||""}</span>
   <div class="m">${esc(r.id)} · ${esc(oName(r.office))}${r.type==="ap"?" · "+esc(r.time):""}</div><div>${esc(r.text)}</div>
   <div class="acts">${["new","progress","done"].filter(s=>s!==r.status).map(s=>`<button data-s="${s}" data-i="${esc(r.id)}">${t("st")[s]}</button>`).join("")}${isAdmin()?`<button data-dr="${esc(r.id)}">${t("delete")}</button>`:""}</div></div>`;
  return`<h2>${t("staff")}</h2>${bar()}<div class="seg" style="flex-direction:column">
  <select id="s_d">${ds.map(d=>`<option value="${d}" ${d===staffDate?"selected":""}>${fmt(d)}</option>`).join("")}</select>
  <select id="s_o" ${isAdmin()?"":"disabled"}><option value="all">${t("all")}</option>${O.map(o=>`<option value="${o[0]}" ${o[0]===staffOff?"selected":""}>${esc(o[LI[lang]])}</option>`).join("")}</select></div>
  <div class="stats"><div class="st"><b>${aps.length}</b>${t("nApp")}</div><div class="st"><b>${open}</b>${t("nCo")}</div></div>
  <h2 style="font-size:18px">${t("nApp")}</h2>${aps.map(item).join("")||`<p class="m">${t("none")}</p>`}
  <h2 style="font-size:18px">${t("co")}</h2>${cos.map(item).join("")||`<p class="m">${t("none")}</p>`}
  <p class="note">${t("foot")}</p>`;
}

function adminView(){
  if(!ready)return`<p class="note">…</p>`;
  if(!meAcc)return adminAuthView();
  if(!isStaffOk())return pendingView();
  if(!isAdmin())return`<h2>${t("adminNav")}</h2>${bar()}<div class="item">${t("adminOnly")}</div>`;
  listen();if(!accLoaded)refreshAcc();
  const c=k=>rows.filter(r=>r.status===k).length;
  return`<h2>${t("adminNav")}</h2>${bar()}
  <div class="stats"><div class="st"><b>${rows.length}</b>${t("statReq")}</div><div class="st"><b>${accs.filter(a=>a.status==="ok").length}</b>${t("statStaff")}</div><div class="st"><b>${c("new")}</b>${t("st").new}</div><div class="st"><b>${c("progress")}</b>${t("st").progress}</div></div>
  ${invitePanel()}${adminPanel()}${pwPanel()}`;
}

  const c=adminSetup;
  return`<h2>${t("adminNav")}</h2>
  <label>${t("pass")}</label><input id="ad_p" type="password" autocomplete="${c?"new-password":"current-password"}">
  ${c?`<label>${t("pass2")}</label><input id="ad_p2" type="password" autocomplete="new-password">`:""}
  <div class="err">${aerr}</div><button class="btn" id="ad_go" ${busy?"disabled":""}>${c?t("create"):t("signin")}</button>
  ${(c||location.hash==="#setup")?`<button class="btn g" id="ad_tg">${c?t("backToLogin"):t("firstSetup")}</button>`:""}
`;
}
function pwPanel(){
  return`<h2 style="font-size:18px;margin-top:22px">${t("changePw")}</h2><div class="item"><label style="margin-top:0">${t("curPw")}</label><input id="cp_o" type="password" autocomplete="current-password"><label>${t("newPw")}</label><input id="cp_n" type="password" autocomplete="new-password"><div class="err">${perr}</div>${pmsg?`<div class="m" style="color:var(--ok);font-weight:700">${pmsg}</div>`:""}<button class="btn" id="cp_go" style="margin-top:12px">${t("changePw")}</button></div>`;
}
function authView(){
  const c=authTab==="create";
  const offs=O.map(o=>`<option value="${o[0]}">${esc(o[LI[lang]])}</option>`).join("");
  return`<h2>${t("staff")}</h2><div class="seg"><button data-a="in" class="${c?"":"on"}">${t("signin")}</button><button data-a="create" class="${c?"on":""}">${t("create")}</button></div>
  ${c?`<label>${t("name")}</label><input id="a_n" autocomplete="name" maxlength="80"><label>${t("offices")}</label><select id="a_o">${offs}</select><label>${t("codeLbl")}</label><input id="a_c" autocapitalize="characters" autocomplete="off" spellcheck="false" maxlength="12" style="letter-spacing:.15em;text-transform:uppercase">`:""}
  <label>${t("user")}</label><input id="a_u" autocomplete="username" autocapitalize="none" spellcheck="false">
  <label>${t("pass")}</label><input id="a_p" type="password" autocomplete="${c?"new-password":"current-password"}">
  ${c?`<label>${t("pass2")}</label><input id="a_p2" type="password" autocomplete="new-password">`:""}
  <div class="err">${aerr}</div><button class="btn" id="a_go" ${busy?"disabled":""}>${c?t("create"):t("signin")}</button>
`;

function pendingView(){
  return`<h2>${t("staff")}</h2><div class="item">${meAcc.status==="suspended"?t("suspendedMsg"):t("pending")}</div><div class="err">${aerr}</div><button class="btn g" id="a_re">${t("recheck")}</button><button class="btn g" id="a_out">${t("signout")}</button>`;
}
function bar(){
  return`<div class="bar"><div><b>${esc(meAcc.name)}</b><div class="m">${t("role")[meAcc.role]} · ${esc(oName(meAcc.office))}</div></div><button class="btn g" id="a_out" style="width:auto;margin:0;padding:10px 14px">${t("signout")}</button></div>${db?"":`<div class="item">${t("noDb")}</div>`}`;
}
function adminPanel(){
  const cd=c=>c.slice(0,4)+"-"+c.slice(4);
  const row=a=>{const i=esc(a.id),mine=a.id===meAcc.id;
    return`<div class="item"><b>${esc(a.name)}</b> · @${esc(a.username||"")} <span class="pill s-${a.status==="ok"?"done":a.status==="suspended"?"new":"progress"}">${a.status==="ok"?t("role")[a.role]:a.status==="suspended"?t("suspendedS"):t("pendingS")}</span><div class="m">${esc(oName(a.office))}${a.code?" · "+esc(cd(a.code)):""}</div>${mine?"":`<div class="acts">${a.status!=="ok"?`<button data-ap="${i}">${t("activate")}</button>`:`<button data-su="${i}">${t("suspend")}</button>`}<button data-rl="${i}" data-r="${a.role==="admin"?"staff":"admin"}">${a.role==="admin"?t("makeStaff"):t("makeAdmin")}</button><button data-rm="${i}">${t("remove")}</button></div><select data-co="${i}" style="margin-top:8px">${O.map(o=>`<option value="${o[0]}" ${o[0]===a.office?"selected":""}>${esc(o[LI[lang]])}</option>`).join("")}</select>`}</div>`};
  return`<h2 style="font-size:18px;margin-top:22px">${t("staffH")}</h2>${accs.map(row).join("")}`;
}
function invitePanel(){
  const g=c=>c.slice(0,4)+"-"+c.slice(4);
  const row=i=>`<div class="item"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><code style="font-size:22px;font-weight:900;letter-spacing:.12em;color:var(--ac)">${esc(g(i.id))}</code><span class="pill s-${i.used?"done":"new"}">${i.used?t("usedS"):t("unusedS")}</span></div><div class="m">${esc(oName(i.office))}${i.label?" · "+esc(i.label):""}</div><div class="acts">${i.used?"":`<button data-cp="${esc(i.id)}">${t("copy")}</button>`}<button data-ri="${esc(i.id)}">${t("remove")}</button></div></div>`;
  return`<h2 style="font-size:18px">${t("inviteH")}</h2><div class="item"><label style="margin-top:0">${t("offices")}</label><select id="i_o">${O.map(o=>`<option value="${o[0]}" ${o[0]===invOff?"selected":""}>${esc(o[LI[lang]])}</option>`).join("")}</select><label>${t("label")}</label><input id="i_l" maxlength="60"><button class="btn" id="i_go" style="margin-top:12px">${t("genCode")}</button></div>${invs.map(row).join("")}`;
}

/* ---------- events ---------- */
let sentOffline=false;
function bind(){
  const A=$("#app");
  A.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{office=b.dataset.o;view="form";sent=null;err="";kind="ap";render();scrollTo(0,0)});
  const bk=$("#bk");if(bk)bk.onclick=()=>{view="home";render()};
  const hm=$("#home");if(hm)hm.onclick=()=>{view="home";sent=null;render();scrollTo(0,0)};
  A.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{kind=b.dataset.k;err="";render()});
  const go=$("#go");if(go)go.onclick=submit;
  const sd=$("#s_d");if(sd)sd.onchange=()=>{staffDate=sd.value;render()};
  const so=$("#s_o");if(so)so.onchange=()=>{staffOff=so.value;render()};
  A.querySelectorAll("[data-s]").forEach(b=>b.onclick=async()=>{try{await db.collection("reqs").doc(b.dataset.i).update({status:b.dataset.s})}catch(e){}});
  A.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{authTab=b.dataset.a;aerr="";render()});
  A.querySelectorAll("#a_n,#a_c,#a_u,#a_p,#a_p2").forEach(i=>i.onkeydown=e=>{if(e.key==="Enter")doAuth()});
  const ag=$("#a_go");if(ag)ag.onclick=doAuth;
  const ao=$("#a_out");if(ao)ao.onclick=signOut;
  const ar=$("#a_re");if(ar)ar.onclick=recheck;
  A.querySelectorAll("[data-ap]").forEach(b=>b.onclick=async()=>{try{await db.collection("staff").doc(b.dataset.ap).update({status:"ok"})}catch(e){}accLoaded=false;render()});
  A.querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{if(!confirm(t("confirmDel")))return;try{await db.collection("staff").doc(b.dataset.rm).delete()}catch(e){}accLoaded=false;render()});
  A.querySelectorAll("[data-su]").forEach(b=>b.onclick=async()=>{try{await db.collection("staff").doc(b.dataset.su).update({status:"suspended"})}catch(e){}accLoaded=false;render()});
  A.querySelectorAll("[data-rl]").forEach(b=>b.onclick=async()=>{try{await db.collection("staff").doc(b.dataset.rl).update({role:b.dataset.r})}catch(e){}accLoaded=false;render()});
  A.querySelectorAll("[data-co]").forEach(b=>b.onchange=async()=>{try{await db.collection("staff").doc(b.dataset.co).update({office:b.value})}catch(e){}accLoaded=false;render()});
  A.querySelectorAll("[data-dr]").forEach(b=>b.onclick=async()=>{if(!confirm(t("confirmDel")))return;try{await db.collection("reqs").doc(b.dataset.dr).delete()}catch(e){}});
  const agg=$("#ad_go");if(agg)agg.onclick=doAdminAuth;
  const atg=$("#ad_tg");if(atg)atg.onclick=()=>{adminSetup=!adminSetup;aerr="";render()};
  A.querySelectorAll("#ad_n,#ad_u,#ad_p,#ad_p2").forEach(i=>i.onkeydown=e=>{if(e.key==="Enter")doAdminAuth()});
  const cpg=$("#cp_go");if(cpg)cpg.onclick=changePw;
  const io=$("#i_o");if(io)io.onchange=()=>{invOff=io.value};
  const ig=$("#i_go");if(ig)ig.onclick=async()=>{
    const al="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    const code=[...crypto.getRandomValues(new Uint8Array(8))].map(x=>al[x%al.length]).join("");
    invOff=$("#i_o").value;
    try{await db.collection("invites").doc(code).set({office:invOff,label:($("#i_l").value||"").trim(),created:Date.now(),used:false,createdBy:meAcc.id})}catch(e){}
    accLoaded=false;render()};
  A.querySelectorAll("[data-ri]").forEach(b=>b.onclick=async()=>{try{await db.collection("invites").doc(b.dataset.ri).delete()}catch(e){}accLoaded=false;render()});
  A.querySelectorAll("[data-cp]").forEach(b=>b.onclick=async()=>{const c=b.dataset.cp,x=c.slice(0,4)+"-"+c.slice(4);try{await navigator.clipboard.writeText(x)}catch(e){}b.textContent="✓"});
}
async function submit(){
  const v=id=>($("#"+id)?.value||"").trim();
  const r={type:kind,office,name:v("f_n"),phone:v("f_p"),text:v("f_x"),status:"new",created:Date.now()};
  if(kind==="ap"){r.date=v("f_d");r.time=v("f_t")}
  if(!r.name||!r.phone||!r.text){err=t("req");render();return}
  const id=(kind==="ap"?"AP-":"CO-")+Math.random().toString(36).slice(2,7).toUpperCase();
  sentOffline=false;
  if(db){try{await db.collection("reqs").doc(id).set(r)}catch(e){sentOffline=true}}else sentOffline=true;
  const mine=store.get("mine",[]);mine.push({id,office,type:kind,date:r.date,time:r.time});store.set("mine",mine.slice(-20));
  sent=id;render();scrollTo(0,0);
}
document.querySelectorAll("#lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;store.set("lang",lang);render()});

render();
