<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Face Vote</title>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js"></script>
<style>
:root{--bg:#050b1f;--card:#0a1536;--line:#2a5bff;--txt:#e8eefc;--ok:#22c55e;--err:#ef4444}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#0b1e5c,#050b1f 60%);color:var(--txt);font-family:system-ui,sans-serif;min-height:100vh}
header{padding:14px 18px;font-weight:700;font-size:18px;border-bottom:1px solid #1b3a8a}
nav{display:flex;gap:6px;padding:10px;max-width:480px;margin:auto}
nav button{flex:1;padding:10px;border:1px solid var(--line);background:transparent;color:var(--txt);border-radius:10px;font-weight:600}
nav button.on{background:var(--line)}
.card{max-width:480px;margin:10px auto;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:0 0 24px #2a5bff55}
h2{margin:0 0 12px}
input{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:#fff;font-size:16px}
.btn{width:100%;padding:14px;margin-top:10px;border:0;border-radius:10px;background:linear-gradient(90deg,#1f6bff,#2a9bff);color:#fff;font-size:17px;font-weight:700}
.btn:disabled{opacity:.5}.btn.sec{background:#1b2a5c}
.cam{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.tag{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:var(--ok);padding:4px 12px;border-radius:8px;font-weight:700;display:none;z-index:2}
.msg{margin-top:12px;padding:12px;border-radius:10px;display:none}
.msg.ok{display:block;background:#0b3d1d;border:1px solid var(--ok)}.msg.err{display:block;background:#4a1010;border:1px solid var(--err)}.msg.info{display:block;background:#12224f;border:1px solid var(--line)}
.cands{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.cand{border:2px solid #1b3a8a;border-radius:12px;padding:10px 4px;text-align:center;cursor:pointer}
.cand.sel{border-color:#2a9bff;background:#12306f}
.av{width:56px;height:56px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}
.row{margin:12px 0}.row .top{display:flex;justify-content:space-between}
.bar{height:12px;border-radius:6px;background:#12224f;overflow:hidden}.bar i{display:block;height:100%;transition:width .5s}
small{opacity:.7}.hide{display:none}
</style></head><body>
<header>🗳️ Face-Verified Voting System</header>
<nav id="nav">
 <button data-t="verify" class="on">Verify</button><button data-t="register">Register</button>
 <button data-t="vote">Vote</button><button data-t="results">Results</button>
</nav>

<div class="card" id="status"><span id="st">Loading face models…</span></div>

<div class="card" id="cam-card">
 <div class="cam"><video id="v" playsinline muted autoplay></video><canvas id="ov"></canvas><div class="tag" id="tag">Face Verified ✓</div></div>
</div>

<div class="card" id="p-verify">
 <h2>Face Verification</h2>
 <input id="vid" inputmode="numeric" placeholder="Fayda ID (FIN 12 / FAN 16 digits)">
 <button class="btn sec fay" id="vfay">🇪🇹 Sign in with Fayda</button>
 <button class="btn" id="vbtn" disabled>Verify my face</button><div class="msg" id="vmsg"></div>
</div>

<div class="card hide" id="p-register">
 <h2>Register Voter</h2>
 <input id="rid" inputmode="numeric" placeholder="Fayda ID (FIN 12 / FAN 16 digits)"><input id="rname" placeholder="Full name">
 <button class="btn sec fay" id="rfay">🇪🇹 Link with Fayda ID</button>
 <button class="btn" id="rbtn" disabled>Capture face &amp; Register</button><div class="msg" id="rmsg"></div>
</div>

<div class="card hide" id="p-vote">
 <h2>Cast Your Vote</h2><div id="vwho"></div>
 <div class="cands" id="cands"></div>
 <button class="btn" id="sbtn">✓ Submit Vote</button><div class="msg" id="smsg"></div>
</div>

<div class="card hide" id="p-results">
 <h2>Live Results</h2><div id="res"></div><small id="tot"></small>
 <button class="btn sec" id="reset">Reset all data (admin)</button>
</div>

<script>
const $=id=>document.getElementById(id);
const MODELS='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/';
const THRESH=0.5, COLORS=['#38bdf8','#22c55e','#a855f7','#f59e0b','#ef4444'];
const store={
  get voters(){return JSON.parse(localStorage.fv_voters||'{}')},
  set voters(x){localStorage.fv_voters=JSON.stringify(x)},
  get cands(){return JSON.parse(localStorage.fv_cands||'null')||[{name:'Alice',votes:0},{name:'Bob',votes:0},{name:'Carol',votes:0}]},
  set cands(x){localStorage.fv_cands=JSON.stringify(x)}
};
let session=null, selected=null, ready=false;
const opts=new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:0.5});

function msg(el,type,t){el.className='msg '+type;el.textContent=t}
function tab(t){
  ['verify','register','vote','results'].forEach(x=>$('p-'+x).classList.toggle('hide',x!==t));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  $('cam-card').classList.toggle('hide',t==='vote'||t==='results');
  if(t==='vote'){ if(!session){tab('verify');msg($('vmsg'),'err','Verify your face first.');return} renderVote() }
  if(t==='results') renderResults();
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.t));

async function init(){
  try{
    await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(MODELS),
      faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODELS),
      faceapi.nets.faceRecognitionNet.loadFromUri(MODELS)]);
    $('st').textContent='Starting camera…';
    $('v').srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480}});
    await $('v').play();
    ready=true;$('vbtn').disabled=false;$('rbtn').disabled=false;
    $('status').classList.add('hide');
    loop();
  }catch(e){$('st').textContent='Error: '+e.message+' (needs internet for models + camera permission)'}
}
async function loop(){ // live green box
  const v=$('v'),c=$('ov');
  if(v.videoWidth){c.width=v.videoWidth;c.height=v.videoHeight;
    const d=await faceapi.detectAllFaces(v,opts),ctx=c.getContext('2d');
    ctx.clearRect(0,0,c.width,c.height);
    ctx.strokeStyle='#22c55e';ctx.lineWidth=3;
    d.forEach(f=>ctx.strokeRect(f.box.x,f.box.y,f.box.width,f.box.height));}
  setTimeout(loop,150);
}
async function getDescriptor(){
  const all=await faceapi.detectAllFaces($('v'),opts).withFaceLandmarks(true).withFaceDescriptors();
  if(all.length===0) throw new Error('No face detected. Improve lighting.');
  if(all.length>1) throw new Error('Multiple faces detected. Only one person allowed.');
  return Array.from(all[0].descriptor);
}
const dist=(a,b)=>Math.hypot(...a.map((x,i)=>x-b[i]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));


/* ===== Fayda (Ethiopian National ID) via eSignet OIDC =====
   Fill these after NIDP onboarding at id.gov.et. Leave enabled:false for demo mode
   (format check only — NOT verified against the national database). */
const FAYDA={enabled:false,
  authorizeUrl:'',            // eSignet authorization endpoint given by NIDP
  clientId:'',                // your registered client_id
  redirectUri:location.origin+location.pathname,
  backend:'',                 // e.g. https://your-server.com  (runs fayda_backend.py)
  scope:'openid profile', acr:'mosip:idp:acr:generated-code'}; // only ACRs you are approved for
const ID_RE=/^(\d{12}|\d{16})$/;   // FIN 12 digits / FAN 16 digits — confirm in NIDP docs
let fayda=null; // {id, sub, name} after successful Fayda login
const b64u=u=>btoa(String.fromCharCode(...u)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function faydaLogin(mode){
  const id=(mode==='register'?$('rid'):$('vid')).value.trim(),m=mode==='register'?$('rmsg'):$('vmsg');
  if(!ID_RE.test(id))return msg(m,'err','Enter a valid Fayda FIN (12 digits) or FAN (16 digits).');
  const verifier=b64u(crypto.getRandomValues(new Uint8Array(32))),state=b64u(crypto.getRandomValues(new Uint8Array(16)));
  const challenge=b64u(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier))));
  sessionStorage.fv_pending=JSON.stringify({mode,id,name:$('rname').value,verifier,state});
  location.href=FAYDA.authorizeUrl+'?'+new URLSearchParams({response_type:'code',client_id:FAYDA.clientId,
    redirect_uri:FAYDA.redirectUri,scope:FAYDA.scope,state,acr_values:FAYDA.acr,
    code_challenge:challenge,code_challenge_method:'S256'});
}
async function faydaCallback(){
  const q=new URLSearchParams(location.search),code=q.get('code');if(!code)return;
  const p=JSON.parse(sessionStorage.fv_pending||'null');history.replaceState({},'',location.pathname);
  const m=p&&p.mode==='register'?$('rmsg'):$('vmsg');if(p)tab(p.mode);
  try{
    if(!p||p.state!==q.get('state'))throw new Error('Invalid login state. Try again.');
    const r=await (await fetch(FAYDA.backend+'/fayda/exchange',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code,code_verifier:p.verifier,redirect_uri:FAYDA.redirectUri})})).json();
    if(!r.sub)throw new Error(r.error||'Fayda login failed.');
    fayda={id:p.id,sub:r.sub,name:r.name||p.name,birthdate:r.birthdate,gender:r.gender};
    $('rid').value=$('vid').value=p.id;$('rname').value=fayda.name||'';
    msg(m,'ok','✔ Fayda verified: '+[fayda.name,fayda.birthdate,fayda.gender].filter(Boolean).join(' • ')+'. Now complete the face step.');
  }catch(e){msg(m,'err',e.message)}
  sessionStorage.removeItem('fv_pending');
}
if(FAYDA.enabled){$('rname').readOnly=true;$('rname').placeholder='Name (auto-filled from Fayda)'}
$('rfay').onclick=()=>faydaLogin('register');$('vfay').onclick=()=>faydaLogin('verify');
if(!FAYDA.enabled){document.querySelectorAll('.fay').forEach(b=>b.classList.add('hide'));
  msg($('vmsg'),'info','Demo mode: Fayda ID format is checked, but not verified against the national ID system.')}

$('rbtn').onclick=async()=>{
  const id=$('rid').value.trim(),name=$('rname').value.trim(),m=$('rmsg');
  if(!id||!name)return msg(m,'err','ID and name required.');
  if(!ID_RE.test(id))return msg(m,'err','Enter a valid Fayda FIN (12 digits) or FAN (16 digits).');
  if(FAYDA.enabled){if(!fayda||fayda.id!==id)return msg(m,'err','Link your Fayda ID first.');
    if(Object.values(store.voters).some(o=>o.sub===fayda.sub))return msg(m,'err','This Fayda identity is already registered.');
    if(fayda.birthdate){const a=(Date.now()-new Date(fayda.birthdate))/31557600000;if(a<18)return msg(m,'err','You must be 18 or older to register.');}}
  const vs=store.voters; if(vs[id])return msg(m,'err','This ID is already registered.');
  $('rbtn').disabled=true;
  try{
    const ds=[];
    for(let i=0;i<5;i++){msg(m,'info',`Capturing sample ${i+1}/5 — hold still, slightly turn your head`);ds.push(await getDescriptor());await sleep(600)}
    for(const [oid,o] of Object.entries(vs)) if(o.descs.some(d=>ds.some(x=>dist(d,x)<THRESH))) throw new Error('This face is already registered under another ID.');
    vs[id]={name:fayda?fayda.name:name,descs:ds,voted:false,sub:fayda?fayda.sub:null,birthdate:fayda?fayda.birthdate:null,gender:fayda?fayda.gender:null};store.voters=vs;
    msg(m,'ok','✔ Registered! You can now verify.');$('rid').value=$('rname').value='';
  }catch(e){msg(m,'err',e.message)}
  $('rbtn').disabled=false;
};

$('vbtn').onclick=async()=>{
  const id=$('vid').value.trim(),m=$('vmsg'),vs=store.voters,voter=vs[id];
  $('tag').style.display='none';
  if(!voter)return msg(m,'err','Unknown voter ID.');
  if(voter.voted)return msg(m,'err','This voter has already voted.');
  if(FAYDA.enabled&&(!fayda||fayda.id!==id||fayda.sub!==voter.sub))return msg(m,'err','Sign in with Fayda first (must match this ID).');
  $('vbtn').disabled=true;msg(m,'info','Scanning face…');
  try{
    const d=await getDescriptor(),best=Math.min(...voter.descs.map(x=>dist(x,d)));
    if(best>=THRESH) throw new Error('Face does not match this ID.');
    session=id;$('tag').style.display='block';
    msg(m,'ok','✔ Verification Successful. Welcome, '+voter.name);
    setTimeout(()=>tab('vote'),1200);
  }catch(e){msg(m,'err',e.message)}
  $('vbtn').disabled=false;
};

function renderVote(){
  $('vwho').innerHTML='<small>Voting as '+store.voters[session].name+'</small>';
  selected=null;$('smsg').className='msg';
  $('cands').innerHTML=store.cands.map((c,i)=>`<div class="cand" data-i="${i}"><div class="av" style="background:${COLORS[i%5]}33;color:${COLORS[i%5]}">${c.name[0]}</div>${c.name}</div>`).join('');
  document.querySelectorAll('.cand').forEach(el=>el.onclick=()=>{
    selected=+el.dataset.i;document.querySelectorAll('.cand').forEach(x=>x.classList.toggle('sel',x===el))});
}
$('sbtn').onclick=()=>{
  const m=$('smsg');if(selected===null)return msg(m,'err','Pick a candidate.');
  const vs=store.voters;if(!session||vs[session].voted)return msg(m,'err','Already voted.');
  const cs=store.cands;cs[selected].votes++;store.cands=cs;
  vs[session].voted=true;store.voters=vs;session=null;
  msg(m,'ok','✔ Vote recorded. Thank you!');setTimeout(()=>tab('results'),1000);
};

function renderResults(){
  const cs=store.cands,t=cs.reduce((a,c)=>a+c.votes,0);
  $('res').innerHTML=cs.map((c,i)=>{const p=t?(100*c.votes/t):0;
    return `<div class="row"><div class="top"><span>${c.name}</span><span>${p.toFixed(1)}% (${c.votes})</span></div><div class="bar"><i style="width:${p}%;background:${COLORS[i%5]}"></i></div></div>`}).join('');
  $('tot').textContent='Total votes: '+t;
}
$('reset').onclick=()=>{if(confirm('Delete ALL voters and votes?')){localStorage.removeItem('fv_voters');localStorage.removeItem('fv_cands');renderResults()}};
window.addEventListener('storage',()=>{if(!$('p-results').classList.contains('hide'))renderResults()});
setInterval(()=>{if(!$('p-results').classList.contains('hide'))renderResults()},3000);
init();faydaCallback();
</script></body></html>
