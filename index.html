<html lang="en">

        .input {
            width: 100%;
            border: 1px solid #d8cdb5;
            border-radius: 0.5rem;
            padding: 0.65rem 0.75rem;
            font-size: 0.875rem;
            background: #ffffff;

            outline: none;
        }
        .input:focus {
            border-color: #4c2fae;
            box-shadow: 0 0 0 2px rgba(76,47,174,0.15);
        }
        @keyframes pulse-animation {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.02); opacity: 0.85; }
            100% { transform: scale(1); opacity: 1; }
        }
        #draw-animation-container {
            animation: pulse-animation 1.5s infinite;
        }

</head>

                    IMO

    <!-- App Logic Script -->
    <script>
        const seedWinners = [];

        // Helper function to load the persistent draw date safely from localStorage or use default
        function getStoredDrawDate() {
            const saved = localStorage.getItem('yemane_admin_draw_date');
            return saved ? saved : "2026-09-08T22:33:00";
        }

        let appState = {
            page: "billboard",
            lang: "en",
            entries: [],
            officialWinners: [],
            dynamicWinners: [],
            preselectDraw: "",
            billboardSearchQuery: "",
            isAdminLoggedIn: false,
            adminShowPassword: false,
            adminEmail: "",
            adminPassword: "",
            adminRemember: false,
            adminLoginError: "",
            registerForm: { firstName: "", middleName: "", lastName: "", phone: "", draw: "", fileName: "", fileData: "", error: "" },
            drawDateStr: getStoredDrawDate(), // Loaded from localStorage
            isDrawingInProgress: false,
            drawProgressText: ""
        };

        let countdownTimerInterval = null;

        function genTicketId() {
            return `LOT-${Math.random().toString(36).substring(2, 8).toUpperCase()}${Math.floor(10 + Math.random() * 90)}`;
        }

        const router = {
            navigate(pageName, param) {
                appState.page = pageName;
                if (param && pageName === 'register') {
                    appState.preselectDraw = param;
                }
                render();
                window.scrollTo(0, 0);
            }
        };

        function toggleLang() {
            appState.lang = appState.lang === "en" ? "am" : "en";
            document.getElementById("lang-label").innerText = appState.lang === "en" ? "Amharic" : "English";
            render();
        }

        function toggleMobileMenu() {
            const menu = document.getElementById("mobile-menu");
            menu.classList.toggle("hidden");
        }

        function openImageModal(url, title) {
            document.getElementById("modal-image-src").src = url;
            document.getElementById("modal-image-title").innerText = title || "Receipt Preview";
            document.getElementById("image-modal").classList.remove("hidden");
        }

        function closeImageModal() {
            document.getElementById("image-modal").classList.add("hidden");
        }

        function formatDisplayDate(isoString) {
            if (!isoString) return "";
            const d = new Date(isoString);
            if (isNaN(d.getTime())) return isoString;
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear();
            const hours = String(d.getHours()).padStart(2, '0');
            const mins = String(d.getMinutes()).padStart(2, '0');
            const secs = String(d.getSeconds()).padStart(2, '0');
            return `${day}/${month}/${year}, ${hours}:${mins}:${secs}`;
        }

        function startCountdownTimer() {
            if (countdownTimerInterval) clearInterval(countdownTimerInterval);

            function updateClock() {
                // Ensure we read latest from localStorage/appState
                const currentDrawStr = getStoredDrawDate();
                const targetTime = new Date(currentDrawStr).getTime();
                const now = new Date().getTime();
                const diff = targetTime - now;

                const daysEl = document.getElementById("timer-days");
                const hoursEl = document.getElementById("timer-hours");
                const minsEl = document.getElementById("timer-mins");
                const secsEl = document.getElementById("timer-secs");

                if (!daysEl || !hoursEl || !minsEl || !secsEl) return;

                if (diff <= 0) {
                    daysEl.innerText = "00";
                    hoursEl.innerText = "00";
                    minsEl.innerText = "00";
                    secsEl.innerText = "00";
                    return;
                }

                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const secs = Math.floor((diff % (1000 * 60)) / 1000);

                daysEl.innerText = String(days).padStart(2, '0');
                hoursEl.innerText = String(hours).padStart(2, '0');
                minsEl.innerText = String(mins).padStart(2, '0');
                secsEl.innerText = String(secs).padStart(2, '0');
            }

            updateClock();
            countdownTimerInterval = setInterval(updateClock, 1000);
        }

        function render() {
            if (countdownTimerInterval) clearInterval(countdownTimerInterval);
            const main = document.getElementById("main-content");
            updateNavActiveState();

            // Sync appState drawDateStr with storage on every render
            appState.drawDateStr = getStoredDrawDate();

            switch (appState.page) {
                case "billboard":
                    main.innerHTML = renderBillboard();
                    setTimeout(startCountdownTimer, 50);
                    break;
                case "register":
                    main.innerHTML = renderRegister();
                    break;
                case "statusConfirm":
                    main.innerHTML = renderConfirmation();
                    break;
                case "winners":
                    main.innerHTML = renderWinners();
                    break;
                case "adminLogin":
                    main.innerHTML = renderAdminLogin();
                    break;
                case "adminDashboard":
                    main.innerHTML = renderAdminDashboard();
                    break;
                case "status":
                    main.innerHTML = renderStatusCheck();
                    break;
                default:
                    main.innerHTML = renderBillboard();
                    setTimeout(startCountdownTimer, 50);
            }
            lucide.createIcons();
        }

        function updateNavActiveState() {
            const adminBtn = document.getElementById("nav-admin");
            if (adminBtn) {
                adminBtn.innerText = appState.isAdminLoggedIn ? "Admin Dashboard" : "Admin Login";
            }
        }

                `${e.firstName} ${e.middleName || ''} ${e.lastName}`.toLowerCase().includes(query)

                        <!-- Prize Tiers breakdown -->

                        </div>

                        <!-- Trophy banner -->
                        <div class="bg-[#fef9e7] border border-[#f3d980] rounded-xl py-2 px-3 text-center text-xs font-semibold text-[#8a6d10] mb-4 flex items-center justify-center gap-2">
                            <span>🏆</span> ዕድልዎን ይመኩሩ
                        </div>

                        <!-- Participants & Max Winners badges -->
                        <div class="flex items-center justify-center gap-2 mb-4">
                            <span class="bg-[#f4f1fb] text-[#4c2fae] text-[11px] font-semibold px-2.5 py-1 rounded-lg flex items-center gap-1 border border-[#e3d8f0]">
                                👥 ${appState.entries.length} Participants
                            </span>
                            <span class="bg-[#fef2f2] text-[#dc2626] text-[11px] font-semibold px-2.5 py-1 rounded-lg flex items-center gap-1 border border-[#fecaca]">
                                <span>🔥</span> 4 Winners Max

                        <!-- Countdown Box -->
                        <div class="bg-[#fcfbfa] border border-[#e8ddc8] rounded-2xl p-3 text-center mb-5">

                        <!-- Register Now Button -->
                        <button onclick="router.navigate('register', 'gena')" class="w-full bg-gradient-to-r from-[#4c2fae] via-[#9d4edd] to-[#e056fd] text-white font-semibold py-3 rounded-xl flex items-center justify-center gap-2 transition-all shadow-md text-sm">

            e.preventDefault();

        function handleDragLeave(e) {
            e.preventDefault();
            e.stopPropagation();
            const dropZone = document.getElementById("drop-zone");
            if (dropZone) dropZone.classList.remove("border-[#4c2fae]", "bg-[#f4f1fb]");

        function handleDrop(e) {
            e.preventDefault();
            e.stopPropagation();
            const dropZone = document.getElementById("drop-zone");
            if (dropZone) dropZone.classList.remove("border-[#4c2fae]", "bg-[#f4f1fb]");
            const files = e.dataTransfer.files;
            if (files && files.length > 0) processFile(files[0]);

        function processFile(file) {
            if (file.size > 5 * 1024 * 1024) {
                appState.registerForm.error = "File is larger than 5MB. Please choose a smaller file.";
                render();
                return;
            }
            const reader = new FileReader();
            reader.onload = function(uploadEvent) {
                appState.registerForm.error = "";
                appState.registerForm.fileName = file.name;
                appState.registerForm.fileData = uploadEvent.target.result;
                const display = document.getElementById("file-name-display");
                if (display) display.innerText = file.name;
                else render();
            };
            reader.readAsDataURL(file);
        }

        function executeRandomDraw() {
            const approvedEntries = appState.entries.filter(e => e.status === 'approved');
            if (approvedEntries.length === 0) {
                alert("No approved registered users available for the draw.");
                return;
            }

            appState.isDrawingInProgress = true;
            appState.drawProgressText = "Shuffling approved participants...";
            render();

            const btn = document.getElementById('execute-draw-btn');
            if (btn) btn.disabled = true;

            let statusContainer = document.getElementById('draw-animation-container');
            if (!statusContainer) {
                statusContainer = document.createElement('div');
                statusContainer.id = 'draw-animation-container';
                statusContainer.style.cssText = "margin: 15px 0; padding: 15px; background: #f8f9fa; border: 2px dashed #28a745; text-align: center; border-radius: 8px;";
                if (btn && btn.parentNode) {
                    btn.parentNode.insertBefore(statusContainer, btn.nextSibling);
                }
            }

            let timeLeft = 60; // 1 minute delay
            const shufflingPool = approvedEntries.map(e => `${e.id} - ${e.firstName} ${e.lastName} (+${e.phone})`);
            
            const shuffleInterval = setInterval(() => {
                const randomText = shufflingPool[Math.floor(Math.random() * shufflingPool.length)] || "Verifying ticket entries...";
                const containerEl = document.getElementById('draw-animation-container');
                if (containerEl) {
                    containerEl.innerHTML = `
                        <div class="spinner-border text-success" role="status" style="width: 2rem; height: 2rem;"></div>
                        <h4 style="color: #28a745; margin-top: 10px;">🎲 Drawing in Progress...</h4>
                        <p style="font-size: 16px; font-weight: bold; font-family: monospace; color: #333;">${randomText}</p>
                        <p style="color: #666; font-size: 14px;">Time remaining: <strong>${timeLeft}</strong> seconds</p>
                    `;
                }
            }, 150);

            const countdownTimer = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(countdownTimer);
                    clearInterval(shuffleInterval);
                    
                    const shuffled = [...approvedEntries].sort(() => 0.5 - Math.random());
                    const selectedWinners = shuffled.slice(0, Math.min(4, shuffled.length));
                    
                    while (selectedWinners.length < 4 && approvedEntries.length > 0) {
                        selectedWinners.push(approvedEntries[Math.floor(Math.random() * approvedEntries.length)]);
                    }

                    appState.officialWinners = selectedWinners;
                    appState.dynamicWinners = selectedWinners.map((w, idx) => ({
                        id: w.id,
                        name: `${w.firstName} ${w.middleName || ''} ${w.lastName}`,
                        draw: idx === 0 ? "Grand Live Draw" : "Special Live Draw",
                        prize: idx === 0 ? "200,000 ETB" : idx === 1 ? "150,000 ETB" : idx === 2 ? "100,000 ETB" : "50,000 ETB",
                        quote: idx === 0 ? "A life-changing moment! Thank you Yemane Digital Lottery." : undefined
                    }));

                    appState.isDrawingInProgress = false;
                    appState.drawProgressText = "";
                    render();
                }
            }, 1000);
        }

                                    ${appState.officialWinners.map((w, index) => `
                                        <div class="bg-gradient-to-r from-[#fef9e7] to-[#fff] border border-[#f3d980] rounded-xl p-4 shadow-sm relative">
                                            <div class="absolute top-3 right-3 text-xs font-bold text-[#8a6d10]">Winner #${index + 1}</div>
                                            <div class="font-bold text-[#1a1440] text-sm">${w.firstName} ${w.middleName || ''} ${w.lastName}</div>
                                            <div class="text-xs text-[#6a6480] mb-2">+${w.phone}</div>
                                            <div class="bg-white/80 border border-[#eee3d0] rounded-lg p-2.5 text-xs space-y-1">
                                                <div><span class="text-[#8a8398]">Code:</span> <span class="font-mono text-[#4c2fae] font-semibold">${w.id}</span></div>
                                                <div><span class="text-[#8a8398]">Receipt:</span> ${w.fileName}</div>
                                                <div><span class="text-[#8a8398]">Date:</span> ${w.submittedAt}</div>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            `}
                        </div>

                        <div>
                            <h2 class="font-bold text-[#1a1440] text-sm mb-3">Registered Users</h2>
                            
                            ${appState.entries.length === 0 ? `
                                <div class="bg-[#fcfbfa] border border-dashed border-[#d8cdb5] rounded-xl py-8 text-center text-xs text-[#8a8398]">
                                    No registered users found.
                                </div>
                            ` : `
                                <div class="space-y-4">
                                    ${appState.entries.map(user => `
                                        <div class="bg-white border border-[#e8ddc8] rounded-2xl p-4 shadow-sm">
                                            <div class="flex items-start justify-between mb-2">
                                                <div>
                                                    <div class="font-bold text-[#1a1440] text-sm">${user.firstName} ${user.middleName || ''} ${user.lastName}</div>
                                                    <div class="text-xs text-[#6a6480]">+${user.phone}</div>
                                                </div>
                                                <span class="${user.status === 'approved' ? 'bg-[#e6f4ea] text-[#137333]' : 'bg-[#fef3c7] text-[#b45309]'} text-[10px] font-bold px-2 py-0.5 rounded tracking-wide uppercase">
                                                    ${user.status}
                                                </span>
                                            </div>

                                            <div class="bg-[#fcfbfa] border border-[#eee3d0] rounded-xl p-3 text-xs space-y-1 mb-3">
                                                <div><span class="text-[#8a8398]">Code:</span> <span class="font-mono text-[#4c2fae] font-semibold">${user.id}</span></div>
                                                <div><span class="text-[#8a8398]">Receipt:</span> <button onclick="openImageModal('${user.fileData}', '${user.fileName}')" class="text-[#4c2fae] font-semibold underline hover:text-[#2a2260] inline-flex items-center gap-1">${user.fileName} <i data-lucide="image" width="12" height="12"></i></button></div>
                                                <div><span class="text-[#8a8398]">Date:</span> ${user.submittedAt}</div>
                                            </div>

                                            <div class="mb-3 cursor-pointer group rounded-lg overflow-hidden border border-[#e8ddc8] bg-gray-50 h-24 relative" onclick="openImageModal('${user.fileData}', '${user.fileName}')">
                                                <img src="${user.fileData}" alt="Receipt" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-200" />
                                                <div class="absolute inset-0 bg-black/30 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-white text-xs font-semibold gap-1">
                                                    <i data-lucide="zoom-in" width="14" height="14"></i> Tap to view receipt
                                                </div>
                                            </div>

                                            <div class="flex gap-2">
                                                ${user.status === 'pending' ? `
                                                    <button onclick="approveEntry('${user.id}')" class="flex-1 bg-[#1b8a3e] hover:bg-[#167032] text-white font-semibold py-2 rounded-xl text-xs transition-colors shadow-sm">
                                                        Approve Payment
                                                    </button>
                                                ` : ''}
                                                <button onclick="removeEntry('${user.id}')" class="${user.status === 'pending' ? 'flex-1' : 'w-full'} bg-[#ef4444] hover:bg-[#dc2626] text-white font-semibold py-2 rounded-xl text-xs transition-colors shadow-sm">
                                                    Remove
                                                </button>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            `}
                        </div>
                    </div>
                </div>
            `;
        }

        function updateDrawDate(e) {
            const val = document.getElementById("admin-draw-date-input").value;
            if (val) {
                // Save to localStorage so it persists across refreshes and page reloads
                localStorage.setItem('yemane_admin_draw_date', val);
                appState.drawDateStr = val;

                alert("Draw target date updated successfully! The billboard timer will now count down to this new date.");
                router.navigate('billboard');
            }
        }
    </script>

    <!-- Firebase SDK & Database Integration Module -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-analytics.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAuvNzd5bAWt0L2-aHQ6ggF1TZTuZLAda8",
            authDomain: "yemane-digital.firebaseapp.com",
            projectId: "yemane-digital",
            storageBucket: "yemane-digital.firebasestorage.app",
            messagingSenderId: "451594378938",
            appId: "1:451594378938:web:d6b168c0cda33cd895ac83",
            measurementId: "G-5KGW7XPWWZ"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        // Fetch all lottery entries from Firestore
        async function loadEntriesFromFirebase() {
            try {
                const querySnapshot = await getDocs(collection(db, "lotteryEntries"));
                appState.entries = [];
                querySnapshot.forEach((documentSnapshot) => {
                    appState.entries.push({
                        docId: documentSnapshot.id,
                        ...documentSnapshot.data()
                    });
                });
                if (typeof render === 'function' && (appState.page === 'billboard' || appState.page === 'adminDashboard')) {
                    render();
                }
            } catch (e) {
                console.error("Error loading entries from Firestore:", e);
            }
        }

        // Save a new entry to Firestore collection 'lotteryEntries'
        submitRegistrationToCloud = async function(participantData) {
            try {
                const docRef = await addDoc(collection(db, "lotteryEntries"), {
                    id: participantData.id,
                    firstName: participantData.firstName,
                    middleName: participantData.middleName || "",
                    lastName: participantData.lastName,
                    phone: participantData.phone,
                    draw: participantData.draw,
                    fileName: participantData.fileName,
                    fileData: participantData.fileData,
                    status: "pending",
                    submittedAt: participantData.submittedAt
                });

                appState.statusResult = participantData;
                appState.registerForm = { firstName: "", middleName: "", lastName: "", phone: "", draw: "", fileName: "", fileData: "", error: "" };
                
                await loadEntriesFromFirebase();
                router.navigate('statusConfirm');
            } catch (e) {
                console.error("Error writing document to Firestore:", e);
                appState.registerForm.error = "Cloud submission failed. Please check your connection.";
                render();
            }
        };

        // Approve entry status in Firestore
        approveEntryInCloud = async function(ticketId) {
            try {
                const targetEntry = appState.entries.find(e => e.id === ticketId);
                if (targetEntry && targetEntry.docId) {
                    const entryRef = doc(db, "lotteryEntries", targetEntry.docId);
                    await updateDoc(entryRef, { status: "approved" });
                    await loadEntriesFromFirebase();
                }
            } catch (e) {
                console.error("Error updating entry status:", e);
            }
        };

        // Remove entry from Firestore
        removeEntryFromCloud = async function(ticketId) {
            try {
                const targetEntry = appState.entries.find(e => e.id === ticketId);
                if (targetEntry && targetEntry.docId) {
                    const entryRef = doc(db, "lotteryEntries", targetEntry.docId);
                    await deleteDoc(entryRef);
                    await loadEntriesFromFirebase();
                }
            } catch (e) {
                console.error("Error deleting entry from Firestore:", e);
            }
        };

        // Initial load on startup
        window.addEventListener('DOMContentLoaded', () => {
            loadEntriesFromFirebase();
        });
    </script>
</body>
</html>
